<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Training Pub Remote Control · Minimal UI</title>
  <style>
    :root {
      --bg: #0f172a;        /* slate-900 */
      --panel: #111827;     /* gray-900 */
      --muted: #94a3b8;     /* slate-400 */
      --text: #e5e7eb;      /* gray-200 */
      --accent: #22c55e;    /* emerald-500 */
      --accent-2: #16a34a;  /* emerald-600 */
      --border: #1f2937;    /* gray-800 */
      --danger: #ef4444;    /* red-500 */
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji";
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
    }
    .app {
      width: 100%; max-width: 960px; background: var(--panel); border: 1px solid var(--border);
      border-radius: 16px; padding: 20px 20px 16px; box-shadow: 0 10px 30px rgba(0,0,0,.3);
    }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    h1 { font-size: 18px; margin: 0; letter-spacing: .2px; }
    .sub { font-size: 12px; color: var(--muted); }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

    .card { border: 1px solid var(--border); border-radius: 12px; padding: 12px; background: #0b1220; }

    label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px; }
    select, input[type="text"] {
      width: 100%; background: #0a0f1d; color: var(--text); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 12px; outline: none; font-size: 14px;
    }
    select:focus, input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(34,197,94,.15); }

    .buttons { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn {
      appearance: none; border: 1px solid var(--border); background: #0c1322; color: var(--text);
      padding: 10px 14px; border-radius: 10px; cursor: pointer; font-size: 14px; transition: transform .03s ease, background .2s ease, border-color .2s ease;
    }
    .btn:hover { background: #0f1830; border-color: #243045; }
    .btn:active { transform: translateY(1px); }
    .btn.primary { background: var(--accent); color: #07120a; border-color: var(--accent-2); }
    .btn.primary:hover { background: var(--accent-2); }
    .btn.danger { background: #2b0e0e; border-color: #3a0f0f; color: #ffdede; }
    .btn.danger:hover { background: #3a1414; }

    .result {
      margin-top: 12px; border: 1px solid var(--border); background: #060b17; border-radius: 10px; padding: 12px; min-height: 160px; overflow: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 13px;
      white-space: pre-wrap; word-break: break-word;
    }
    .muted { color: var(--muted); }
    footer { margin-top: 10px; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

    @media (max-width: 720px) {
      .row, .row-3 { grid-template-columns: 1fr; }
      header { flex-direction: column; align-items: flex-start; gap: 4px; }
    }
  </style>
</head>
<body>
  <div class="app" role="application" aria-label="Training Pub Remote Control">
    <header>
      <div>
        <h1>Training Pub Remote Control · Minimal UI</h1>
        <div class="sub">Select Pub and UserID, then run a command. Output appears below.</div>
      </div>
      <button class="btn primary" id="btn-reset" title="Reset form values">Reset</button>
    </header>

    <!-- Link current web user to app_user_id -->
    <div class="card" style="margin-bottom:12px;">
      <label class="muted">Link Web user to <code>app_user_id</code> (one-time per browser)</label>
      <div class="row">
        <div>
          <input type="text" id="linkUserInput" placeholder="Enter app_user_id (e.g. user001)" />
        </div>
        <div>
          <button class="btn primary" id="btn-link">Link UserID</button>
        </div>
      </div>
      <div class="sub">Auth UID: <span id="authUidLbl">—</span></div>
    </div>

    <!-- Context selectors -->
    <div class="row">
      <div class="card">
        <label for="pubSelect">Pub (WebAppName)</label>
        <select id="pubSelect" aria-label="Select Pub"></select>
      </div>
      <div class="card">
        <label for="userSelect">UserID</label>
        <select id="userSelect" aria-label="Select UserID"></select>
      </div>
    </div>

    <!-- Key / Value inputs -->
    <div class="row-3" style="margin-top:12px;">
      <div class="card">
        <label for="keyInput">key</label>
        <input type="text" id="keyInput" placeholder="e.g. progress.chapter" />
      </div>
      <div class="card">
        <label for="valueInput">value</label>
        <input type="text" id="valueInput" placeholder='e.g. {"page":3}' />
      </div>
      <div class="card">
        <label for="extraInput">optional (notes / filter)</label>
        <input type="text" id="extraInput" placeholder="optional context" />
      </div>
    </div>

    <!-- Command buttons -->
    <div class="card" style="margin-top:12px;">
      <label class="muted">Commands</label>
      <div class="buttons" role="group" aria-label="Commands">
        <button class="btn" id="btn-get">getItem(key)</button>
        <button class="btn" id="btn-set">setItem(key, value)</button>
        <button class="btn" id="btn-remove">removeItem(key)</button>
        <button class="btn danger" id="btn-clear" title="Clears data for selected WebAppName">clear()</button>
        <button class="btn" id="btn-keys">keys()</button>
        <button class="btn" id="btn-mig-from">migrateFromLocalStorage()</button>
        <button class="btn" id="btn-mig-to">migrateToLocalStorage()</button>
      </div>
    </div>

    <!-- Output -->
    <div class="card" style="margin-top:12px;">
      <label for="result" class="muted">Result / Logs</label>
      <div id="result" class="result" aria-live="polite">Ready. Link your app_user_id, then load pubs.</div>
    </div>

    <footer>
      <div>WebAppName = <span id="currentWebAppName" class="muted">—</span></div>
      <div>UserID = <span id="currentUserId" class="muted">—</span></div>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ===================== Supabase config =====================
    const SUPABASE_URL = 'https://slgdsksjkqfbckyjdrcj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNsZ2Rza3Nqa3FmYmNreWpkcmNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEyOTc4MDUsImV4cCI6MjA3Njg3MzgwNX0.jL8kINGW_1V4xKVzZHBVBQ5LHrivOcMBMMosO9U8kFU';
    const supabase = window.supabase?.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Tables
    const TBL_COMMANDS = 'commands';
    const TBL_RESULTS  = 'results';

    // ===================== UI helpers =====================
    const getEl = (id) => document.getElementById(id);
    const print = (obj, as='json') => {
      const out = getEl('result'); const time = new Date().toLocaleTimeString();
      out.textContent = as==='json' ? `[${time}]\n`+JSON.stringify(obj,null,2) : `[${time}]\n`+String(obj);
    };
    const getSelectedContext = () => {
      const pub = getEl('pubSelect').value; const userId = getEl('userSelect').value;
      return { webAppName: pub, userId };
    };
    const refreshContextBadges = () => {
      const {webAppName,userId} = getSelectedContext();
      getEl('currentWebAppName').textContent = webAppName || '—';
      getEl('currentUserId').textContent     = userId || '—';
    };
    const resetForm = () => {
      getEl('keyInput').value=''; getEl('valueInput').value=''; getEl('extraInput').value='';
      print('Ready. Select a command.');
    };

    // Stable deviceId in browser
    const deviceId = (() => {
      const k='rc_device_id'; let v=localStorage.getItem(k);
      if(!v){ v = (crypto?.randomUUID?.() || String(Date.now())); localStorage.setItem(k, v); }
      return v;
    })();

    // ===================== Auth (anonymous) + link =====================
    async function ensureAnonSession() {
      const { data: sess } = await supabase.auth.getSession();
      if (!sess?.session) {
        const { data, error } = await supabase.auth.signInAnonymously();
        if (error) { print({ ok:false, step:'signInAnonymously', error: error.message }); return null; }
        return data.session;
      }
      return sess.session;
    }
    async function getAuthUid() {
      const { data } = await supabase.auth.getUser();
      return data?.user?.id || null;
    }
    async function linkCurrentUser(appUserId) {
      const uid = await getAuthUid();
      if (!uid) return { ok:false, error:'No auth.uid. Sign-in failed?' };
      const payload = { auth_uid: uid, app_user_id: appUserId };
      const { error } = await supabase
        .from('user_links')
        .upsert(payload, { onConflict: 'auth_uid,app_user_id', ignoreDuplicates: true });
      if (error) return { ok:false, error: error.message };
      return { ok:true, auth_uid: uid, app_user_id: appUserId };
    }

    // ===================== Data loading (via RLS after link) =====================
    async function loadPubs(){
      print('Loading pubs...');
      const q = supabase
        .from(TBL_COMMANDS)
        .select('web_app_name,user_id')
        .order('web_app_name', { ascending: true });

      const { data, error, status } = await q;
      console.log('loadPubs response:', { status, error, rows: data?.length, sample: data?.slice?.(0,5) });
      if (error) { print({ step:'loadPubs', status, error: error.message }); return; }

      // map pub -> set(userIds)
      const pubMap = new Map();
      (data||[]).forEach(r=>{
        const pub = r.web_app_name; const uid = r.user_id;
        if(!pub) return;
        if(!pubMap.has(pub)) pubMap.set(pub, new Set());
        if(uid) pubMap.get(pub).add(uid);
      });

      const pubSel = getEl('pubSelect');
      const userSel = getEl('userSelect');
      pubSel.innerHTML = ''; userSel.innerHTML = '';

      [...pubMap.keys()].forEach(pub=>{
        const o=document.createElement('option'); o.value=pub; o.textContent=pub; pubSel.appendChild(o);
      });

      window.__PUB_USER_MAP__ = pubMap;
      if(pubSel.options.length>0){ pubSel.selectedIndex = 0; await loadUsersForSelectedPub(); }
      refreshContextBadges();
      print({ ok:true, pubs:[...pubMap.keys()] });
    }

    async function loadUsersForSelectedPub(){
      const pub = getEl('pubSelect').value; const userSel = getEl('userSelect');
      userSel.innerHTML = '';
      const map = window.__PUB_USER_MAP__ || new Map();
      const users = map.get(pub) ? [...map.get(pub)] : [];
      users.sort();
      users.forEach(u=>{ const o=document.createElement('option'); o.value=u; o.textContent=u; userSel.appendChild(o); });
      if(userSel.options.length>0) userSel.selectedIndex = 0;
      refreshContextBadges();
    }

    // ===================== Commands via RPC (enqueue_command) =====================
    async function enqueue(type, payload){
      const { webAppName, userId } = getSelectedContext();
      if(!webAppName) return { ok:false, error:'Please select WebAppName' };
      if(!userId)     return { ok:false, error:'Please select UserID' };
      const { data, error } = await supabase.rpc('enqueue_command', {
        p_user_id: userId,
        p_device_id: deviceId,
        p_web_app_name: webAppName,
        p_type: type,
        p_payload: payload || {}
      });
      if (error) return { ok:false, error: error.message };
      return { ok:true, command: data };
    }

    // Optional one-shot poll (you also have realtime below)
    async function fetchResultOnce(commandId){
      const { data, error } = await supabase
        .from(TBL_RESULTS)
        .select('*')
        .eq('command_id', commandId)
        .order('created_at', { ascending:false })
        .limit(1)
        .maybeSingle();
      if(error) return { ok:false, error:error.message };
      if(!data) return { ok:true, pending:true };
      return { ok:true, pending:false, result:data };
    }

    // ===================== Button handlers =====================
    async function onGet(){
      const key = getEl('keyInput').value.trim(); 
      if(!key) return print({ok:false,error:'key is required for getItem'});
      const ins = await enqueue('getItem', { key }); print(ins);
      if(ins.ok){ const r = await fetchResultOnce(ins.command.id); print({ command: ins.command, result: r }); }
    }
    async function onSet(){
      const key = getEl('keyInput').value.trim(); const val = getEl('valueInput').value.trim();
      if(!key) return print({ok:false,error:'key is required for setItem'});
      if(!val) return print({ok:false,error:'value is required for setItem'});
      const ins = await enqueue('setItem', { key, value: val }); print(ins);
    }
    async function onRemove(){
      const key = getEl('keyInput').value.trim(); if(!key) return print({ok:false,error:'key is required for removeItem'});
      const ins = await enqueue('removeItem', { key }); print(ins);
    }
    async function onClear(){ const ins = await enqueue('clear', {}); print(ins); }
    async function onKeys(){
      const ins = await enqueue('keys', {}); print(ins);
      if(ins.ok){ const r = await fetchResultOnce(ins.command.id); print({ command: ins.command, result: r }); }
    }
    async function onMigrateFrom(){ const ins = await enqueue('migrateFromLocalStorage', {}); print(ins); }
    async function onMigrateTo(){ const ins = await enqueue('migrateToLocalStorage', {}); print(ins); }

    // ===================== Realtime (results) =====================
    function subscribeResults(){
      supabase
        .channel('results-watch')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: TBL_RESULTS }, (payload) => {
          print({ realtime: true, result: payload.new });
        })
        .subscribe((status) => console.log('Realtime status:', status));
    }

    // ===================== Wiring =====================
    window.addEventListener('DOMContentLoaded', async () => {
      // Buttons
      getEl('btn-get').addEventListener('click', onGet);
      getEl('btn-set').addEventListener('click', onSet);
      getEl('btn-remove').addEventListener('click', onRemove);
      getEl('btn-clear').addEventListener('click', onClear);
      getEl('btn-keys').addEventListener('click', onKeys);
      getEl('btn-mig-from').addEventListener('click', onMigrateFrom);
      getEl('btn-mig-to').addEventListener('click', onMigrateTo);

      getEl('btn-reset').addEventListener('click', resetForm);
      getEl('pubSelect').addEventListener('change', async ()=>{ await loadUsersForSelectedPub(); });
      getEl('userSelect').addEventListener('change', refreshContextBadges);

      // Initial UI
      refreshContextBadges();
      print('Initializing...');

      // Config check
      if(!SUPABASE_URL || !SUPABASE_ANON_KEY){
        print({ ok:false, error:'Please configure SUPABASE_URL and SUPABASE_ANON_KEY.' });
        return;
      }

      // Anonymous sign-in
      const session = await ensureAnonSession();
      if(!session){ return; }
      const uid = await getAuthUid();
      getEl('authUidLbl').textContent = uid || '—';

      // Link button
      getEl('btn-link').addEventListener('click', async () => {
        const appUserId = getEl('linkUserInput').value.trim();
        if (!appUserId) return print({ ok:false, error:'Enter app_user_id first' });
        const res = await linkCurrentUser(appUserId);
        print({ step:'linkUser', ...res });
        if (res.ok) {
          await loadPubs();          // RLS тепер пропустить
          subscribeResults();        // слухаємо відповіді
        }
      });

      // За бажанням: якщо цей браузер уже лінкований (ти збережеш app_user_id у localStorage)
      // можна автозавантажити pubs. Зараз лишаю явний клік Link для прозорості.
    });
  </script>
</body>
</html>
